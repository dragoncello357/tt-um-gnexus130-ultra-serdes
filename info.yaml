# Tiny Tapeout Project Information
yaml_version: 6

project:
  title:        "G-NEXUS 130 ULTRA v3"
  author:       "Gabriel D'Amico"
  discord:      ""
  description:  "14 G-Cores Quad-State logic, UMA 1024-bit bus with 28-pin SerDes and BIOS boot engine"
  language:     "Verilog"
  clock_hz:     35000000
  tiles:        "1x1"

  # Nome del modulo top-level
  top_module:   "tt_um_gnexus130_ultra_serdes"

  # Elenco dei file Verilog
  source_files:
    - "tt_um_gnexus130_ultra_serdes.v"

# Mappatura dei 28 pin I/O
pinout:
  ui:
    - "BOOT_MODE0"
    - "BOOT_MODE1"
    - "SERDES_RX0"
    - "SERDES_RX1"
    - "SERDES_RX2"
    - "SERDES_RX3"
    - "UI_IN6"
    - "UI_IN7"
  uo:
    - "SERDES_TX0"
    - "SERDES_TX1"
    - "SERDES_TX2"
    - "SERDES_TX3"
    - "VIDEO_TMDS_P"
    - "VIDEO_TMDS_N"
    - "BIOS_SPI_CLK"
    - "STATUS_LOCK"
  uio:
    - "QSPI_DATA0"
    - "QSPI_DATA1"
    - "QSPI_DATA2"
    - "QSPI_DATA3"
    - "LPDDR_CTRL0"
    - "LPDDR_CTRL1"
    - "LPDDR_CTRL2"
    - "SYS_INTERRUPT"