# Tiny Tapeout Project Information
# CHIP: G-NEXUS 130 ULTRA v3
# AUTHOR: Gabriel D'Amico

project:
  title:        "G-NEXUS 130 ULTRA v3"
  author:       "Gabriel D'Amico"
  discord:      "dragoncello23"      
  description:  "14 G-Cores Quad-State logic, UMA 1024-bit bus with 28-pin SerDes and BIOS boot engine"
  language:     "Verilog"
  clock_hz:     35000000

  top_module:   "tt_um_gnexus130_ultra_serdes"

  source_files:
    - "tt_um_gnexus130_ultra_serdes.v"


pinout:
  # Inputs (ui_in)
  ui[0]: "CLK_REF / System Clock In"
  ui[1]: "RST_N Hardware Reset"
  ui[2]: "BOOT_MODE[0]"
  ui[3]: "BOOT_MODE[1]"
  ui[4]: "SERDES_RX[0]"
  ui[5]: "SERDES_RX[1]"
  ui[6]: "SERDES_RX[2]"
  ui[7]: "SERDES_RX[3]"

  # Outpouts (uo_out)
  uo[0]: "SERDES_TX[0]"
  uo[1]: "SERDES_TX[1]"
  uo[2]: "SERDES_TX[2]"
  uo[3]: "SERDES_TX[3]"
  uo[4]: "VIDEO_TMDS_P"
  uo[5]: "VIDEO_TMDS_N"
  uo[6]: "BIOS_SPI_CLK"
  uo[7]: "STATUS_LOCK"

  # Bidirectional (uio_in / uio_out)
  uio[0]: "QSPI_DATA[0]"
  uio[1]: "QSPI_DATA[1]"
  uio[2]: "QSPI_DATA[2]"
  uio[3]: "QSPI_DATA[3]"
  uio[4]: "LPDDR_CTRL[0]"
  uio[5]: "LPDDR_CTRL[1]"
  uio[6]: "LPDDR_CTRL[2]"
  uio[7]: "SYS_INTERRUPT"